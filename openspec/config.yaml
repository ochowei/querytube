schema: spec-driven

context: |
  OpenSpec changes are proposals for future work; they do not describe current
  architecture or authorize implementation. Treat docs/architecture/ as the
  current architecture on main, and verify current-state statements against
  source code. Organize architecture by viewpoints and logical responsibilities;
  do not assume a bounded context maps one-to-one to a component, module, service,
  container, or deployment unit. For behavior-preserving internal refactors,
  preserve HTTP/OpenAPI contracts, Firestore paths and fields, authorization
  modes, credential payload compatibility, YAML behavior, and JSON/SSE semantics
  unless a separately reviewed change explicitly changes them. Keep artifacts
  in English to match the repository's architecture documentation. Use the
  repository-root CONTEXT.md as the canonical domain glossary and reuse its terms
  in OpenSpec artifacts; update it when a domain term is resolved or changed.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
operations:
  apply:
    guidance:
      - For architecture-impacting changes, include a task to update the affected docs/architecture views after implementation.
      - Verify architecture documentation against the resulting source and include those documentation updates with the implementation before merge.
