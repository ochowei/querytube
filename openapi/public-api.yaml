components:
  schemas:
    PublicQuerySetSummary:
      type: object
      required:
        - id
        - name
        - queryCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Unique identifier of the Query Set.
        name:
          type: string
          description: Name of the Query Set.
        queryCount:
          type: integer
          description: Number of Queries in the YAML Search Definition.
        createdAt:
          type: string
          format: date-time
          description: ISO timestamp when the Query Set was created.
        updatedAt:
          type: string
          format: date-time
          description: ISO timestamp when the Query Set was last modified.

    PublicQuerySet:
      type: object
      required:
        - id
        - name
        - rawYaml
        - queryCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Unique identifier of the Query Set.
        name:
          type: string
          description: Name of the Query Set.
        rawYaml:
          type: string
          description: The saved YAML Search Definition expressed as a string.
        queryCount:
          type: integer
          description: Number of Queries in the YAML Search Definition.
        createdAt:
          type: string
          format: date-time
          description: ISO timestamp when the Query Set was created.
        updatedAt:
          type: string
          format: date-time
          description: ISO timestamp when the Query Set was last modified.

    PublicSearchRunSummary:
      type: object
      required:
        - id
        - status
        - queryCount
        - successfulQueries
        - failedQueries
        - totalResults
        - startedAt
        - createdAt
        - visibility
      properties:
        id:
          type: string
          description: Opaque Search Run identifier scoped by the owner userId; retain both when referring to a run.
        querySetId:
          type: [string, "null"]
          description: Historical association with a source Query Set, which need not still exist.
        querySetName:
          type: [string, "null"]
          description: Name of the associated Query Set at run time, which need not match its current name.
        status:
          type: string
          enum: [running, completed, partial, failed]
          description: Execution outcome status.
        queryCount:
          type: integer
          description: Number of executed queries.
        successfulQueries:
          type: integer
          description: Number of queries that completed successfully.
        failedQueries:
          type: integer
          description: Number of queries that encountered errors.
        totalResults:
          type: integer
          description: Total number of Video Results across all Query Results.
        startedAt:
          type: string
          format: date-time
          description: ISO timestamp when search execution started.
        completedAt:
          type: [string, "null"]
          format: date-time
          description: ISO timestamp when search execution finished.
        createdAt:
          type: string
          format: date-time
          description: ISO timestamp of Search Run document creation.
        visibility:
          type: string
          enum: [public]
          description: Search Run visibility; only public Search Runs are returned.
          example: public

    PublicSearchRun:
      type: object
      required:
        - id
        - status
        - queryCount
        - successfulQueries
        - failedQueries
        - totalResults
        - inputYaml
        - startedAt
        - createdAt
        - visibility
        - queryResults
      properties:
        id:
          type: string
          description: Opaque Search Run identifier scoped by the owner userId; retain both when referring to a run.
        querySetId:
          type: [string, "null"]
          description: Historical association with a source Query Set, which need not still exist.
        querySetName:
          type: [string, "null"]
          description: Name of the associated Query Set at run time, which need not match its current name.
        status:
          type: string
          enum: [running, completed, partial, failed]
          description: Execution outcome status.
        queryCount:
          type: integer
          description: Number of executed queries.
        successfulQueries:
          type: integer
          description: Number of queries that completed successfully.
        failedQueries:
          type: integer
          description: Number of queries that encountered errors.
        totalResults:
          type: integer
          description: Total number of Video Results across all Query Results.
        inputYaml:
          type: string
          description: The YAML Search Definition executed during this Search Run.
        startedAt:
          type: string
          format: date-time
          description: ISO timestamp when search execution started.
        completedAt:
          type: [string, "null"]
          format: date-time
          description: ISO timestamp when search execution finished.
        createdAt:
          type: string
          format: date-time
          description: ISO timestamp of Search Run document creation.
        visibility:
          type: string
          enum: [public]
          description: Search Run visibility; only public Search Runs are returned.
          example: public
        queryResults:
          type: array
          description: Recorded Query Results and their Video Results or failure information. May be empty; array order and video uniqueness across queries are not guaranteed.
          items:
            $ref: '#/components/schemas/QueryResult'

    QueryResult:
      type: object
      required:
        - id
        - sourceQueryId
        - query
        - status
        - resultCount
        - startedAt
        - completedAt
        - videos
      properties:
        id:
          type: string
          description: Unique identifier of the Query Result.
        sourceQueryId:
          type: string
          description: ID from the YAML query definition.
        query:
          type: string
          description: Executed query string.
        relevanceLanguage:
          type: [string, "null"]
          description: ISO 639-1 language code if specified.
        regionCode:
          type: [string, "null"]
          description: ISO 3166-1 alpha-2 country code if specified.
        status:
          type: string
          enum: [success, failed]
          description: Success or failure status of the recorded Query Outcome.
        resultCount:
          type: integer
          description: Number of Video Results in this Query Result.
        errorCode:
          type: [string, "null"]
          description: Error identifier if query failed.
        errorMessage:
          type: [string, "null"]
          description: Error details if query failed.
        startedAt:
          type: string
          anyOf:
            - const: ""
            - format: date-time
          description: ISO timestamp when this individual query began; empty string for legacy records without a timestamp.
        completedAt:
          type: string
          anyOf:
            - const: ""
            - format: date-time
          description: ISO timestamp when this individual query finished; empty string for legacy records without a timestamp.
        videos:
          type: array
          description: Video Results included in this Query Result.
          items:
            $ref: '#/components/schemas/Video'

    Video:
      type: object
      required:
        - videoId
        - title
        - channelId
        - channelTitle
        - publishedAt
        - description
        - url
        - thumbnailUrl
      properties:
        videoId:
          type: string
          description: YouTube video ID.
        title:
          type: string
          description: Recorded video title with decoded HTML entities; empty string when unavailable.
        channelId:
          type: string
          description: YouTube channel ID.
        channelTitle:
          type: string
          description: YouTube channel title.
        publishedAt:
          type: string
          anyOf:
            - const: ""
            - format: date-time
          description: Video publication timestamp; empty string when unavailable.
        description:
          type: string
          description: Video snippet description.
        url:
          type: string
          format: uri
          description: Direct link to watch the video on YouTube.
        thumbnailUrl:
          type: string
          anyOf:
            - const: ""
            - format: uri
          description: Video thumbnail image URL; empty string when unavailable.

        statistics:
          $ref: '#/components/schemas/VideoStatisticsSnapshot'
          description: |
            Optional snapshot captured during this Search Run. Omitted for legacy
            records, inaccessible videos or failed statistics fetching. No live
            statistics lookup or historical backfill is performed.

    VideoStatisticsSnapshot:
      type: object
      description: |
        Historical counts fetched during this Search Run, never refreshed on reads.
        Counts are decimal strings to preserve precision; null means YouTube did not
        provide a valid count, not zero. fetchedAt is the UTC statistics response
        observation time, not the video publication time or Search Run start time.
      required:
        - viewCount
        - likeCount
        - commentCount
        - fetchedAt
      properties:
        viewCount:
          type: [string, "null"]
          pattern: '^[0-9]+$'
        likeCount:
          type: [string, "null"]
          pattern: '^[0-9]+$'
        commentCount:
          type: [string, "null"]
          pattern: '^[0-9]+$'
        fetchedAt:
          type: string
          format: date-time
      example:
        viewCount: "9007199254740993"
        likeCount: "0"
        commentCount: null
        fetchedAt: "2026-10-06T02:00:00.000Z"

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error classification code.
        message:
          type: string
          description: Human-readable error description.
